name: CI

on:
  push:
    branches: [ master, trainer-fly ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: FIRERED
      GAME_LANGUAGE: ENGLISH
      GAME_REVISION: 0
      MODERN: 0
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Checkout agbcc
        uses: actions/checkout@master
        with:
          path: 'agbcc'
          repository: 'pret/agbcc'

      - name: Build
        run: |
          make -j${nproc} all

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FRLGV.gba
          path: pokefirered.gba
          retention-days: 2
          archive: false
